workflows:
  android-apk-build:
    name: Build 0003 Player APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
    scripts:
      - name: Setup Environment & Decode Keystore
        script: |
          # 1. ساخت فایل‌های .env جهت جلوگیری از خطای Plugin
          touch .env.example
          touch .env

          # 2. استخراج صحیح و تمیز فایل کلید بدون شکستگی خطوط
          printf '%s' "$CM_KEYSTORE" | tr -d '\r\n ' | base64 -D -o "$CM_BUILD_DIR/my-upload-key.jks"

          # 3. تست سلامت فایل کلید (اگر خراب باشد همینجا مشخص می‌شود)
          keytool -list -v -keystore "$CM_BUILD_DIR/my-upload-key.jks" -storepass "$STORE_PASSWORD"

          # 4. دانلود و تنظیم Gradle
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$(pwd)/gradle-9.3.1/bin:$PATH

          # 5. ساخت نسخه نهایی Release
          gradle assembleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
